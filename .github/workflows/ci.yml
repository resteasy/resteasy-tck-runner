# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: RESTEasy Jakarta REST 5.0 TCK

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/ci.yml'
      - '**/pom.xml'
      - 'resteasy-tck-adapter/**'
      - 'resteasy-tck-setup/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - '**/pom.xml'
      - 'resteasy-tck-adapter/**'
      - 'resteasy-tck-setup/**'

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  MVN_ARGS: '-V -B -fae'

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          cache: 'maven'
          # Please note the order here of having 25 last as that is the version we want to compile with
          java-version: |
            21
            27
            25
      - name: Build and Test on Java 25
        run: ./mvnw ${{ env.MVN_ARGS }} clean install
      - name: Build and Test on Java 27
        run: ./mvnw ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{env.JAVA_HOME_27_X64}}${{env.JAVA_HOME_27_ARM64}}' '-Dtest.report.dir=java27'
      - name: Build and Test on Java 21
        run: ./mvnw ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{env.JAVA_HOME_21_X64}}${{env.JAVA_HOME_21_ARM64}}' '-Dtest.report.dir=java21'
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log
