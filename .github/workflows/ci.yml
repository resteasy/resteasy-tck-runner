# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: RESTEasy Jakarta REST 3.1 TCK

on:
  push:
    branches:
      - 'jakarta-rest-3.1'
    paths:
      - '**/pom.xml'
      - 'resteasy-tck-adapter/**'
      - 'resteasy-tck-setup/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - '**/pom.xml'
      - 'resteasy-tck-adapter/**'
      - 'resteasy-tck-setup/**'

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v7
      - name: Jakarta REST 3.1 JDK-${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Java ${{ matrix.java }}
        run:  |
          ./mvnw -ntp clean install -U -B -fae
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log
  build-jdk11:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
      - name: Jakarta REST 3.1 JDK-11
        # Wildfly 34 is the last version to support Java 11
        run:  |
          ./mvnw -ntp clean install -U -B -fae -Dversion.org.wildfly=34.0.1.Final -Dwildfly.channel.manifest.artifactId=wildfly-ee -Dserver.test.feature.pack.artifactId=wildfly-ee-galleon-pack
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log
